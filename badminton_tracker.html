<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>羽毛球对决记录 · 战绩中心</title>
<style>
  :root{
    --bg-0:#02040a;
    --bg-1:#050b1a;
    --panel:#0a1226;
    --panel-2:#0d1830;
    --line:#1c2b4a;
    --cyan:#00e5ff;
    --cyan-dim:#0891a8;
    --blue:#3b82f6;
    --purple:#8b5cf6;
    --pink:#ff2d9e;
    --green:#00ffa3;
    --amber:#ffb300;
    --red:#ff4d6d;
    --text:#dce8ff;
    --text-dim:#6b7fa8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    background:
      radial-gradient(circle at 15% 10%, rgba(0,229,255,0.10), transparent 40%),
      radial-gradient(circle at 85% 0%, rgba(139,92,246,0.12), transparent 45%),
      radial-gradient(circle at 50% 100%, rgba(0,255,163,0.06), transparent 50%),
      linear-gradient(180deg, var(--bg-0), var(--bg-1));
    color:var(--text);
    min-height:100vh;
    padding-bottom:60px;
  }
  /* 网格背景动效 */
  .grid-overlay{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      linear-gradient(rgba(0,229,255,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,255,0.05) 1px, transparent 1px);
    background-size:40px 40px;
    mask-image: radial-gradient(circle at 50% 0%, rgba(0,0,0,0.9), transparent 70%);
  }
  .wrap{position:relative; z-index:1; max-width:1100px; margin:0 auto; padding:28px 20px;}

  header{
    text-align:center; margin-bottom:28px;
  }
  header h1{
    font-size:30px; letter-spacing:4px; margin:0;
    background:linear-gradient(90deg, var(--cyan), var(--blue), var(--purple));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 30px rgba(0,229,255,0.3);
    font-weight:800;
  }
  header p{color:var(--text-dim); font-size:13px; margin-top:6px; letter-spacing:2px;}

  .card{
    background:linear-gradient(145deg, var(--panel), var(--panel-2));
    border:1px solid var(--line);
    border-radius:14px;
    padding:22px;
    margin-bottom:22px;
    position:relative;
    box-shadow:0 0 0 1px rgba(0,229,255,0.03), 0 10px 40px -20px rgba(0,229,255,0.15);
  }
  .card::before{
    content:"";
    position:absolute; top:0; left:16px; right:16px; height:1px;
    background:linear-gradient(90deg, transparent, var(--cyan), transparent);
    opacity:0.6;
  }
  .card h2{
    font-size:15px; margin:0 0 16px; color:var(--cyan);
    letter-spacing:2px; display:flex; align-items:center; gap:8px;
  }
  .card h2::before{
    content:""; width:6px; height:6px; border-radius:50%;
    background:var(--cyan); box-shadow:0 0 8px var(--cyan);
  }

  /* 录入表单 */
  .form-grid{
    display:grid;
    grid-template-columns: 1fr 1fr 1fr 1fr auto;
    gap:14px;
    align-items:end;
  }
  @media (max-width:900px){
    .form-grid{grid-template-columns:1fr 1fr;}
  }
  .field{display:flex; flex-direction:column; gap:6px;}
  .field label{font-size:12px; color:var(--text-dim); letter-spacing:1px;}
  input, select{
    background:#050b1a;
    border:1px solid var(--line);
    color:var(--text);
    padding:10px 12px;
    border-radius:8px;
    font-size:14px;
    outline:none;
    transition:border-color .2s, box-shadow .2s;
  }
  input::placeholder{color:#3a4a6b;}
  input:focus, select:focus{
    border-color:var(--cyan);
    box-shadow:0 0 0 3px rgba(0,229,255,0.12);
  }
  .winner-toggle{display:flex; gap:8px;}
  .winner-btn{
    flex:1; padding:10px 8px; text-align:center; border-radius:8px;
    border:1px solid var(--line); cursor:pointer; font-size:13px;
    background:#050b1a; color:var(--text-dim); transition:.2s;
    user-select:none;
  }
  .winner-btn.active-a{
    border-color:var(--cyan); color:var(--cyan);
    background:rgba(0,229,255,0.1); box-shadow:0 0 12px rgba(0,229,255,0.25);
  }
  .winner-btn.active-b{
    border-color:var(--pink); color:var(--pink);
    background:rgba(255,45,158,0.1); box-shadow:0 0 12px rgba(255,45,158,0.25);
  }
  .btn{
    padding:11px 22px;
    border-radius:8px;
    border:none;
    cursor:pointer;
    font-size:14px;
    font-weight:600;
    letter-spacing:1px;
    color:#02040a;
    background:linear-gradient(90deg, var(--cyan), var(--blue));
    box-shadow:0 0 20px rgba(0,229,255,0.35);
    transition:transform .15s, box-shadow .15s;
    white-space:nowrap;
  }
  .btn:hover{transform:translateY(-1px); box-shadow:0 0 26px rgba(0,229,255,0.5);}
  .btn:active{transform:translateY(0);}
  .btn-ghost{
    background:transparent; color:var(--text-dim);
    border:1px solid var(--line); box-shadow:none;
  }
  .btn-ghost:hover{color:var(--cyan); border-color:var(--cyan); box-shadow:0 0 12px rgba(0,229,255,0.2);}
  .btn-sm{padding:6px 12px; font-size:12px;}

  /* 统计区 */
  .stats-grid{
    display:grid; grid-template-columns:repeat(4, 1fr); gap:14px; margin-bottom:18px;
  }
  @media (max-width:700px){.stats-grid{grid-template-columns:repeat(2,1fr);}}
  .stat-box{
    background:#050b1a; border:1px solid var(--line); border-radius:10px;
    padding:16px; text-align:center;
  }
  .stat-box .num{font-size:26px; font-weight:800; color:var(--cyan); text-shadow:0 0 14px rgba(0,229,255,0.4);}
  .stat-box .lbl{font-size:12px; color:var(--text-dim); margin-top:4px; letter-spacing:1px;}
  .stat-box.pink .num{color:var(--pink); text-shadow:0 0 14px rgba(255,45,158,0.4);}
  .stat-box.green .num{color:var(--green); text-shadow:0 0 14px rgba(0,255,163,0.4);}
  .stat-box.amber .num{color:var(--amber); text-shadow:0 0 14px rgba(255,179,0,0.4);}

  .vs-bar{
    display:flex; align-items:center; height:28px; border-radius:14px; overflow:hidden;
    border:1px solid var(--line); margin-bottom:6px;
  }
  .vs-bar .seg{height:100%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; transition:width .4s;}
  .vs-bar .seg-a{background:linear-gradient(90deg, var(--cyan-dim), var(--cyan)); color:#02040a;}
  .vs-bar .seg-b{background:linear-gradient(90deg, var(--pink), #ff6ab8); color:#02040a;}
  .vs-labels{display:flex; justify-content:space-between; font-size:12px; color:var(--text-dim); margin-bottom:16px;}

  /* 表格 */
  table{width:100%; border-collapse:collapse; font-size:13px;}
  thead th{
    text-align:left; padding:10px 12px; color:var(--cyan);
    border-bottom:1px solid var(--line); font-weight:600; letter-spacing:1px;
    white-space:nowrap;
  }
  tbody td{padding:10px 12px; border-bottom:1px solid rgba(28,43,74,0.5); color:var(--text);}
  tbody tr:hover{background:rgba(0,229,255,0.04);}
  .badge{
    display:inline-block; padding:3px 10px; border-radius:20px; font-size:12px; font-weight:600;
  }
  .badge-a{background:rgba(0,229,255,0.15); color:var(--cyan); border:1px solid rgba(0,229,255,0.3);}
  .badge-b{background:rgba(255,45,158,0.15); color:var(--pink); border:1px solid rgba(255,45,158,0.3);}
  .badge-done{background:rgba(0,255,163,0.15); color:var(--green); border:1px solid rgba(0,255,163,0.3);}
  .badge-pending{background:rgba(255,179,0,0.15); color:var(--amber); border:1px solid rgba(255,179,0,0.3);}
  .empty-tip{text-align:center; color:var(--text-dim); padding:30px 0; font-size:13px;}

  .table-scroll{overflow-x:auto;}
  .actions{display:flex; gap:6px;}
  .icon-btn{
    background:none; border:1px solid var(--line); color:var(--text-dim);
    border-radius:6px; padding:4px 8px; cursor:pointer; font-size:12px; transition:.2s;
  }
  .icon-btn:hover{color:var(--cyan); border-color:var(--cyan);}
  .icon-btn.del:hover{color:var(--red); border-color:var(--red);}

  .filter-bar{display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap;}
  .filter-bar select, .filter-bar input{max-width:160px;}

  footer{text-align:center; color:var(--text-dim); font-size:12px; margin-top:20px; letter-spacing:1px;}
</style>
</head>
<body>
<div class="grid-overlay"></div>
<div class="wrap">
  <header>
    <h1>⚡ 羽毛球对决记录 · 战绩中心 ⚡</h1>
    <p>SHADOW COURT BATTLE LOG · 小眼 VS 洋仔</p>
  </header>

  <!-- 录入区 -->
  <div class="card">
    <h2>录入新战绩</h2>
    <div class="form-grid">
      <div class="field">
        <label>比赛时间</label>
        <input type="date" id="inputDate">
      </div>
      <div class="field">
        <label>赢家</label>
        <div class="winner-toggle" id="winnerToggle">
          <div class="winner-btn" data-val="小眼">小眼</div>
          <div class="winner-btn" data-val="洋仔">洋仔</div>
        </div>
      </div>
      <div class="field">
        <label>赌注名称</label>
        <input type="text" id="inputBetName" placeholder="例如：奶茶 / 火锅">
      </div>
      <div class="field">
        <label>赌注数量</label>
        <input type="number" id="inputBetQty" placeholder="例如：1" min="0" step="1">
      </div>
      <div class="field">
        <button class="btn" id="addBtn">＋ 添加记录</button>
      </div>
    </div>
  </div>

  <!-- 统计分析 -->
  <div class="card">
    <h2>统计分析</h2>
    <div class="stats-grid">
      <div class="stat-box"><div class="num" id="statTotal">0</div><div class="lbl">总场次</div></div>
      <div class="stat-box"><div class="num" id="statA">0</div><div class="lbl">小眼 胜场</div></div>
      <div class="stat-box pink"><div class="num" id="statB">0</div><div class="lbl">洋仔 胜场</div></div>
      <div class="stat-box amber"><div class="num" id="statPending">0</div><div class="lbl">未完成赌注</div></div>
    </div>
    <div class="vs-bar" id="vsBar">
      <div class="seg seg-a" id="segA" style="width:50%">0%</div>
      <div class="seg seg-b" id="segB" style="width:50%">0%</div>
    </div>
    <div class="vs-labels"><span>小眼</span><span>洋仔</span></div>
  </div>

  <!-- 记录列表 -->
  <div class="card">
    <h2>对战记录</h2>
    <div class="filter-bar">
      <select id="filterWinner">
        <option value="">全部赢家</option>
        <option value="小眼">小眼</option>
        <option value="洋仔">洋仔</option>
      </select>
      <select id="filterStatus">
        <option value="">全部状态</option>
        <option value="pending">未完成</option>
        <option value="done">已完成</option>
      </select>
      <button class="btn btn-ghost btn-sm" id="clearAllBtn">清空全部</button>
    </div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>时间</th>
            <th>赢家</th>
            <th>赌注</th>
            <th>状态</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="recordBody"></tbody>
      </table>
    </div>
    <div class="empty-tip" id="emptyTip" style="display:none;">暂无记录，快去添加第一场对决吧～</div>
  </div>

  <footer id="syncStatus">正在连接云端数据库…</footer>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getFirestore, collection, onSnapshot,
  addDoc, updateDoc, deleteDoc, doc,
  query, orderBy
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC0ncw9d1xZeKcLRWU_XNBe_UNuo48vueY",
  authDomain: "project-3946857635607586613.firebaseapp.com",
  projectId: "project-3946857635607586613",
  storageBucket: "project-3946857635607586613.firebasestorage.app",
  messagingSenderId: "1061123460041",
  appId: "1:1061123460041:web:742f04decf7bd2e301b618",
  measurementId: "G-429DQ9EGSB"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const recordsCol = collection(db, 'badminton_records');
const recordsQuery = query(recordsCol, orderBy('date', 'desc'));

(function(){
  const STORAGE_KEY = 'badminton_records_v1'; // 离线兜底缓存，Firestore 才是数据的唯一权威来源
  let records = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  let selectedWinner = '小眼';
  const syncStatus = document.getElementById('syncStatus');

  const winnerToggle = document.getElementById('winnerToggle');
  const inputDate = document.getElementById('inputDate');
  const inputBetName = document.getElementById('inputBetName');
  const inputBetQty = document.getElementById('inputBetQty');
  const addBtn = document.getElementById('addBtn');
  const recordBody = document.getElementById('recordBody');
  const emptyTip = document.getElementById('emptyTip');
  const filterWinner = document.getElementById('filterWinner');
  const filterStatus = document.getElementById('filterStatus');
  const clearAllBtn = document.getElementById('clearAllBtn');

  // 默认日期为今天
  inputDate.value = new Date().toISOString().slice(0,10);

  winnerToggle.addEventListener('click', (e) => {
    const btn = e.target.closest('.winner-btn');
    if(!btn) return;
    selectedWinner = btn.dataset.val;
    updateWinnerToggleUI();
  });

  function updateWinnerToggleUI(){
    [...winnerToggle.children].forEach(btn => {
      btn.classList.remove('active-a','active-b');
      if(btn.dataset.val === selectedWinner){
        btn.classList.add(btn.dataset.val === '小眼' ? 'active-a' : 'active-b');
      }
    });
  }
  updateWinnerToggleUI();

  function cacheLocally(){
    // 仅作离线兜底展示，不参与云端同步逻辑
    localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
  }

  addBtn.addEventListener('click', async () => {
    const date = inputDate.value;
    const betName = inputBetName.value.trim();
    const betQty = inputBetQty.value.trim();

    if(!date){
      alert('请选择比赛时间');
      return;
    }
    if(!betName){
      alert('请输入赌注名称');
      return;
    }

    addBtn.disabled = true;
    try{
      await addDoc(recordsCol, {
        date,
        winner: selectedWinner,
        betName,
        betQty: betQty === '' ? '' : Number(betQty),
        done: false
      });
      inputBetName.value = '';
      inputBetQty.value = '';
    }catch(err){
      alert('添加失败，请检查网络后重试：' + err.message);
    }finally{
      addBtn.disabled = false;
    }
  });

  recordBody.addEventListener('click', async (e) => {
    const delBtn = e.target.closest('.icon-btn.del');
    const doneBtn = e.target.closest('.icon-btn.toggle-done');
    if(delBtn){
      const id = delBtn.dataset.id;
      if(confirm('确定删除这条记录吗？')){
        try{
          await deleteDoc(doc(db, 'badminton_records', id));
        }catch(err){
          alert('删除失败：' + err.message);
        }
      }
    }
    if(doneBtn){
      const id = doneBtn.dataset.id;
      const rec = records.find(r => r.id === id);
      if(rec){
        try{
          await updateDoc(doc(db, 'badminton_records', id), { done: !rec.done });
        }catch(err){
          alert('更新失败：' + err.message);
        }
      }
    }
  });

  clearAllBtn.addEventListener('click', async () => {
    if(records.length === 0) return;
    if(confirm('确定清空全部记录吗？此操作不可恢复！')){
      try{
        await Promise.all(records.map(r => deleteDoc(doc(db, 'badminton_records', r.id))));
      }catch(err){
        alert('清空失败：' + err.message);
      }
    }
  });

  filterWinner.addEventListener('change', render);
  filterStatus.addEventListener('change', render);

  function render(){
    // 统计（基于全部记录，不受筛选影响）
    const total = records.length;
    const winA = records.filter(r => r.winner === '小眼').length;
    const winB = records.filter(r => r.winner === '洋仔').length;
    const pending = records.filter(r => !r.done).length;

    document.getElementById('statTotal').textContent = total;
    document.getElementById('statA').textContent = winA;
    document.getElementById('statB').textContent = winB;
    document.getElementById('statPending').textContent = pending;

    const pctA = total ? Math.round(winA/total*100) : 50;
    const pctB = total ? 100 - pctA : 50;
    const segA = document.getElementById('segA');
    const segB = document.getElementById('segB');
    segA.style.width = pctA + '%';
    segB.style.width = pctB + '%';
    segA.textContent = total ? pctA + '%' : '';
    segB.textContent = total ? pctB + '%' : '';

    // 筛选
    let list = records.slice();
    if(filterWinner.value) list = list.filter(r => r.winner === filterWinner.value);
    if(filterStatus.value === 'pending') list = list.filter(r => !r.done);
    if(filterStatus.value === 'done') list = list.filter(r => r.done);

    if(list.length === 0){
      recordBody.innerHTML = '';
      emptyTip.style.display = 'block';
    } else {
      emptyTip.style.display = 'none';
      recordBody.innerHTML = list.map(r => {
        const badgeCls = r.winner === '小眼' ? 'badge-a' : 'badge-b';
        const statusCls = r.done ? 'badge-done' : 'badge-pending';
        const statusText = r.done ? '已完成' : '未完成';
        const qtyText = r.betQty === '' || r.betQty === undefined ? '' : (' × ' + r.betQty);
        return `
          <tr>
            <td>${escapeHtml(r.date)}</td>
            <td><span class="badge ${badgeCls}">${escapeHtml(r.winner)}</span></td>
            <td>${escapeHtml(r.betName)}${qtyText}</td>
            <td><span class="badge ${statusCls}">${statusText}</span></td>
            <td class="actions">
              <button class="icon-btn toggle-done" data-id="${r.id}">${r.done ? '标记未完成' : '标记完成'}</button>
              <button class="icon-btn del" data-id="${r.id}">删除</button>
            </td>
          </tr>
        `;
      }).join('');
    }
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  // 实时监听 Firestore，任何一端的增删改都会自动推送到所有打开的页面
  onSnapshot(recordsQuery, (snapshot) => {
    records = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    cacheLocally();
    syncStatus.textContent = '数据已实时同步至云端 · Firestore';
    render();
  }, (err) => {
    syncStatus.textContent = '云端连接失败，当前显示本地缓存数据：' + err.message;
    render();
  });

  render();
})();
</script>
</body>
</html>
